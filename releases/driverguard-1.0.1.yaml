# Release spec for `da-models publish`.
model: driverguard
version: 1.0.1
status: candidate
description: >-
  YOLOPX perception + DTCP planner on the front camera. Hybrid runtime:
  YOLOPX and DTCP main graph in TensorRT, DTCP control sub-graph in
  onnxruntime CPU (TensorRT 10.3 gives wrong mu/sigma for that sub-graph).
upstream:
  bundle_version: v1-fp32-2026-05-25
  weights:
    dtcp_nusc_route_v1.pt: e342c0b5d9d5b07b930852192fded58f66d2f123c70fcac459522907e2b45e3a
    yolopx_v2_epoch30.pth: 98736417397d5a0a86a991046db5ecc28ac8c9b4e57bbb3175c8947bba9b9066
notes: >-
  Variant of 1.0.0 for TensorRT 8.6 units (JetPack 6.0, e.g. orin-nx):
  same ONNX files, same runtime code, lower minimum versions, and the Python
  packages pycuda and onnxruntime listed. Candidate until validate_jetson.py
  passes on such a unit.
  Not published: dtcp_v1_fp16.engine (old rollback engine). Its outputs are not
  finite (mu/sigma collapse) and no file proves which ONNX made it.
requires:
  jetpack_min: "6.0"
  tensorrt_min: "8.6"
  onnxruntime_min: "1.13"
  python: {pycuda: ">=2024.1", onnxruntime: ">=1.13"}
code:
  repo: ~/driveragent-models
  subdir: runtime/driverguard
files:
  - {name: yolopx_v2.onnx, path: ~/model/jetson_bundle/onnx/yolopx_v2.onnx}
  - {name: dtcp_v1_main.onnx, path: ~/model/jetson_bundle/onnx/dtcp_v1_main.onnx}
  - {name: dtcp_v1_control.onnx, path: ~/model/jetson_bundle/onnx/dtcp_v1_control.onnx}
  - {name: bundle_manifest.json, path: ~/model/jetson_bundle/MANIFEST.json}
  - {name: reference_dtcp_pc.json, path: ~/model/jetson_bundle/samples/reference_dtcp_pc.json}
  # Made by da-models deterministic_targz from ~/model/jetson_bundle/samples (3 frames + manifest + references).
  - {name: validation_samples.tar.gz, path: ~/.cache/da-models-staging/driverguard-1.0.0/validation_samples.tar.gz}
components:
  yolopx:
    runtime: tensorrt
    source: yolopx_v2.onnx
    precision: fp16
    engine: yolopx_v2.engine
    trtexec_flags: "--fp16 --memPoolSize=workspace:4096 --shapes=image:1x3x384x640"
    # The ONNX has a dynamic batch; these are the shapes of the built engine.
    inputs:
      - {name: image, shape: [1, 3, 384, 640]}
    outputs:
      - {name: det, shape: [1, 5040, 15]}
      - {name: da_seg, shape: [1, 2, 384, 640]}
      - {name: ll_seg, shape: [1, 2, 384, 640]}
  dtcp_main:
    runtime: tensorrt
    source: dtcp_v1_main.onnx
    precision: fp32
    engine: dtcp_v1_main.engine
    trtexec_flags: "--memPoolSize=workspace:4096 --noTF32"
  dtcp_control:
    runtime: onnxruntime-cpu
    source: dtcp_v1_control.onnx
    precision: fp32
preprocessing:
  yolopx:
    input: BGR uint8 camera frame (1280x720)
    letterbox: {size: [384, 640], pad_value: 114, interpolation: INTER_AREA}
    color: BGR->RGB
    scale: 1/255
    normalize: {mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
    layout: NCHW float32
  dtcp:
    image: {resize: "stretch to 928x256 (no letterbox)", interpolation: INTER_LINEAR, scale: 1/255,
            normalize: imagenet, layout: NCHW float32}
    state: "[speed_mps/12, target_lat_right_m, target_fwd_m, one_hot(command, 6)] -> 1x9"
    target_point: "[lat_right_m, fwd_m] -> 1x2"
    command_remap: {0: 0, 1: 1, 2: 3, 3: 3, 4: 0, 5: 1}
postprocessing:
  yolopx:
    nms: {conf_thres: 0.30, iou_thres: 0.45, max_det: 300}
    classes: [person, rider, car, bus, truck, bike, motor, traffic light, traffic sign, train]
    masks: "da_seg/ll_seg argmax, un-pad, resize to camera size"
  dtcp:
    pred_speed_mps: "pred_speed * 12"
    steer: "bicycle model from pred_wp[3]; wheelbase 1.78 m; max wheel angle 28 deg"
    controls: "mu/sigma from dtcp_control -> throttle/brake (beta_mode.py)"
  validation: {throttle_mae_max: 0.02, steer_mae_max: 0.02, reference: reference_dtcp_pc.json}
