# Release spec for `da-models publish`.
model: system1
version: 1.0.1
status: candidate
description: >-
  System 1 trajectory model (ConvNeXt V2 Tiny + factorized trajectory scorer,
  47.6M params). Runs in PyTorch with bf16 autocast and two custom CUDA ops.
upstream:
  model_version: v9e
  epoch: 12
notes: >-
  Replaces 1.0.0 (its runtime had no models/backbone.py). Candidate until the Phase 3 smoke test on demo passes. fp16 autocast gives NaN in heading_head; use bf16. The custom ops
  (deformable_aggregation) are compiled on the target by `da-models build`.
requires:
  jetpack_min: "6.1"
  torch_min: "2.8"
  python: {timm: "==1.0.26"}
code:
  repo: ~/driveragent-models
  subdir: runtime/system1
files:
  - {name: system1_deploy.pth, path: ~/model/system1/system1_deploy.pth}
components:
  system1:
    runtime: pytorch
    source: system1_deploy.pth
    precision: bf16
    inputs:
      - {name: images, shape: [1, 6, 3, 256, 704], dtype: float32}
      - {name: ego_state, shape: [1, 8], dtype: float32}
      - {name: projection_mat, shape: [1, 6, 4, 4], dtype: float32}
      - {name: image_wh, shape: [1, 6, 2], dtype: float32}
    outputs:
      - {name: trajectory, shape: [1, 6, 3], dtype: float32}
    build:
      dir: runtime/system1/ops
      command: python3 setup.py build_ext --inplace
      artifacts: ["deformable_aggregation_ext*.so", "deformable_aggregation_with_depth_ext*.so"]
      cache_file: ops-build.tar.gz
preprocessing:
  cameras: 6 (cam0..cam5); intrinsics/extrinsics come from the vehicle calibration, not from the registry
  normalize: {mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
  final_size: [256, 704]
  checkpoint_record: {resize: 0.44, crop: top, raw_size: [900, 1600]}
postprocessing:
  trajectory: "6 waypoints (x, y, heading) in the ego frame"
